name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (for example 0.1.0)
        required: true
        type: string
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build Linux release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config dpkg-dev fuse libfuse2

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qtquickcontrols2'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Configure and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Build and test daemon
        run: |
          cargo build --manifest-path daemon/Cargo.toml --offline --locked --release
          cargo test --manifest-path daemon/Cargo.toml --offline --locked

      - name: Build Debian package
        run: packaging/build-deb.sh "$VERSION"

      - name: Build AppImage tools (pinned upstream releases)
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/appimage-tools/linuxdeploy.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/appimage-tools/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/appimage-tools/linuxdeploy-plugin-qt" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20240109/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimage-tools"/*.AppImage "$RUNNER_TEMP/appimage-tools/linuxdeploy-plugin-qt"
          mv "$RUNNER_TEMP/appimage-tools/linuxdeploy.AppImage" "$RUNNER_TEMP/appimage-tools/linuxdeploy"
          mv "$RUNNER_TEMP/appimage-tools/appimagetool.AppImage" "$RUNNER_TEMP/appimage-tools/appimagetool"
          echo "$RUNNER_TEMP/appimage-tools" >> "$GITHUB_PATH"

      - name: Build AppImage
        run: packaging/build-appimage.sh "$VERSION"

      - name: Generate checksums
        run: sha256sum dist/* > "dist/flydigi-bs2pro-linux-${VERSION}-SHA256SUMS"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: flydigi-bs2pro-linux v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*SHA256SUMS