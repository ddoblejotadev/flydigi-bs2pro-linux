name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test, and stage Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build GUI
        run: cmake --build build --parallel

      - name: Build daemon
        run: cargo build --manifest-path daemon/Cargo.toml --offline --locked --release

      - name: Test GUI
        run: ctest --test-dir build --output-on-failure

      - name: Test daemon
        run: cargo test --manifest-path daemon/Cargo.toml --offline --locked

      - name: Check packaging scripts and whitespace
        run: |
          bash -n packaging/build-appimage.sh packaging/build-deb.sh
          git diff --check

      - name: Stage install tree
        run: cmake --install build --prefix "$RUNNER_TEMP/flydigi-bs2pro-linux"

      - name: Upload staged install
        uses: actions/upload-artifact@v4
        with:
          name: flydigi-bs2pro-linux-install-${{ github.sha }}
          path: ${{ runner.temp }}/flydigi-bs2pro-linux
          if-no-files-found: error
          retention-days: 14